[project]
name = "result"
version = "0.19.0"
description = "A Rust-like result type for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danilo Bargen", email = "mail@dbrgn.ch" }]
maintainers = [{ name = "John Parton" }]
keywords = ["rust", "result", "enum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/john-parton/result"
Documentation = "https://john-parton.github.io/result/"
Changelog = "https://github.com/john-parton/result/blob/main/CHANGELOG.md"
Upstream = "https://github.com/rustedpy/result"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
# CPY001: no per-file copyright headers in this repo
ignore = ["ISC001", "COM812", "CPY001"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "PLR2004"]
"docs/conf.py" = ["INP001", "A001"]
# Ok/Err mirror each other's API, so some methods ignore their arguments
"src/result/result.py" = ["ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "--cov=result",
  "--cov=tests",
  "--cov-report=term",
  "--cov-report=xml",
]
testpaths = [
  "tests",
]
